<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>bizcard-scan</title>

  <!-- PWA & アプリアイコン設定（実ファイル参照版） -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="bizcard-scan">
  <meta name="theme-color" content="#0284c7">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="icon-180.png">

  <style>
    :root {
      --bg-main: #f8fafc;
      --surface: #ffffff;
      --primary: #1e293b;
      --primary-accent: #2563eb;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --card-bg: #f1f5f9;
      --card-active: #e2e8f0;
      --success: #16a34a;
      --error: #ef4444;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      background-color: var(--bg-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 110px;
    }

    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: none; /* ログイン後にJSでflexへ切り替え */
      flex-direction: column;
      gap: 16px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 4px 0;
      gap: 8px;
    }
    .header h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin: 0;
      color: var(--primary);
    }

    .user-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .user-chip .user-name {
      font-weight: 700;
      color: var(--primary);
    }
    .logout-link {
      background: none;
      border: none;
      color: var(--primary-accent);
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      padding: 2px 0;
    }

    .lang-switcher {
      display: flex;
      background: #e2e8f0;
      padding: 3px;
      border-radius: 9999px;
      gap: 2px;
      flex-shrink: 0;
    }
    .lang-btn {
      border: none;
      background: transparent;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .lang-btn.active {
      background: var(--surface);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .mode-tabs {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
      gap: 4px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }
    .mode-btn:active {
      transform: scale(0.98);
    }
    .mode-btn.active {
      background: var(--surface);
      color: var(--primary-accent);
      box-shadow: var(--shadow-sm);
    }

    .scan-card {
      background: var(--surface);
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow-md);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card-label {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .card-label span.badge {
      font-size: 0.7rem;
      padding: 2px 8px;
      background: #e0e7ff;
      color: var(--primary-accent);
      border-radius: 6px;
    }

    .dropzone {
      position: relative;
      background: var(--card-bg);
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      overflow: hidden;
      transition: background 0.15s ease;
    }
    .dropzone:active {
      background: var(--card-active);
    }
    .dropzone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .dropzone-empty {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      pointer-events: none;
    }
    .dropzone-empty svg {
      width: 38px;
      height: 38px;
      stroke: var(--text-muted);
      stroke-width: 1.75;
    }
    .dropzone-empty span {
      font-size: 0.85rem;
      font-weight: 600;
    }

    .dropzone-preview {
      display: none;
      width: 100%;
      height: 100%;
      object-fit: contain;
      max-height: 200px;
      background: #000;
    }

    .retake-overlay {
      position: absolute;
      bottom: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(4px);
      color: #ffffff;
      font-size: 0.7rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      pointer-events: none;
      display: none;
    }

    /* 連続撮影用サムネイルグリッド */
    .batch-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      max-height: 240px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .batch-thumb-item {
      position: relative;
      aspect-ratio: 16 / 10;
      border-radius: 8px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #000;
    }
    .batch-thumb-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .batch-thumb-del {
      position: absolute;
      top: 4px;
      right: 4px;
      background: rgba(239, 68, 68, 0.85);
      color: #fff;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
    }
    .batch-thumb-count {
      position: absolute;
      bottom: 4px;
      left: 4px;
      background: rgba(15, 23, 42, 0.75);
      color: #fff;
      padding: 1px 6px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: bold;
    }

    /* 連続撮影用ライブカメラビュー */
    .start-camera-btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: var(--primary-accent);
      color: #fff;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    .start-camera-btn:active {
      transform: scale(0.98);
    }

    .camera-wrap {
      position: relative;
      width: 100%;
      border-radius: 12px;
      overflow: hidden;
      background: #000;
      aspect-ratio: 4 / 3;
      display: none;
      transition: opacity 0.1s ease;
    }
    .camera-wrap video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .camera-count-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(15, 23, 42, 0.7);
      color: #fff;
      padding: 3px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .camera-finish-btn {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(37, 99, 235, 0.85);
      color: #fff;
      border: none;
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }
    .camera-controls {
      position: absolute;
      bottom: 10px;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .shutter-btn {
      width: 62px;
      height: 62px;
      border-radius: 50%;
      background: #ffffff;
      border: 4px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      padding: 0;
    }
    .shutter-btn:active {
      transform: scale(0.92);
    }
    .shutter-btn:disabled {
      opacity: 0.5;
    }

    .sticky-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      justify-content: center;
      z-index: 50;
    }
    .footer-inner {
      width: 100%;
      max-width: 440px;
    }

    .submit-btn {
      width: 100%;
      background: var(--primary-accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.15s ease;
    }
    .submit-btn:disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
    .submit-btn:not(:disabled):active {
      transform: scale(0.98);
      box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2);
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .loading-box {
      background: var(--surface);
      border-radius: 16px;
      padding: 24px;
      width: 85%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3.5px solid #e2e8f0;
      border-top-color: var(--primary-accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--primary);
      margin: 0;
    }
    .loading-sub {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin: 0;
    }

    .toast-container {
      position: fixed;
      top: 16px;
      left: 16px;
      right: 16px;
      display: flex;
      justify-content: center;
      pointer-events: none;
      z-index: 110;
    }
    .toast {
      background: var(--primary);
      color: #ffffff;
      padding: 12px 18px;
      border-radius: 12px;
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: var(--shadow-lg);
      transform: translateY(-50px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      align-items: center;
      gap: 8px;
      max-width: 380px;
      pointer-events: auto;
      white-space: pre-line;
    }
    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }
    .toast.success { background: var(--success); }
    .toast.error { background: var(--error); }

    /* ==== ログイン画面 ==== */
    .login-overlay {
      position: fixed;
      inset: 0;
      background: var(--bg-main);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      padding: 20px;
    }
    .login-box {
      width: 100%;
      max-width: 360px;
      background: var(--surface);
      border-radius: 20px;
      padding: 28px 24px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .login-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      margin-bottom: 4px;
    }
    .login-icon {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #e0e7ff;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-icon svg {
      width: 24px;
      height: 24px;
      stroke: var(--primary-accent);
      stroke-width: 1.8;
    }
    .login-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary);
      margin: 0;
    }
    .login-sub {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin: 0;
      text-align: center;
    }
    .login-lang-row {
      display: flex;
      justify-content: center;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .field-label {
      font-size: 0.78rem;
      font-weight: 700;
      color: var(--text-muted);
    }
    .field-input {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--card-bg);
      font-size: 0.95rem;
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s ease;
      user-select: text;
    }
    .field-input:focus {
      border-color: var(--primary-accent);
      background: var(--surface);
    }
    .login-submit-btn {
      width: 100%;
      background: var(--primary-accent);
      color: #ffffff;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
      transition: all 0.15s ease;
    }
    .login-submit-btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .login-submit-btn:not(:disabled):active {
      transform: scale(0.98);
    }
    .login-error {
      font-size: 0.78rem;
      color: var(--error);
      text-align: center;
      min-height: 16px;
      margin: 0;
    }
  </style>
</head>
<body>

  <!-- ==== ログイン画面 ==== -->
  <div class="login-overlay" id="loginOverlay">
    <div class="login-box">
      <div class="login-lang-row">
        <div class="lang-switcher">
          <button type="button" class="lang-btn active" id="loginBtnJP" onclick="switchLang('JP')">🇯🇵 日本語</button>
          <button type="button" class="lang-btn" id="loginBtnVN" onclick="switchLang('VN')">🇻🇳 Tiếng Việt</button>
        </div>
      </div>

      <div class="login-header">
        <div class="login-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <circle cx="9" cy="12" r="2"></circle>
            <path d="M14 10h4M14 14h4"></path>
          </svg>
        </div>
        <p class="login-title" id="loginTitle">BizCard Scan</p>
        <p class="login-sub" id="loginSubtitle">社員番号でログインしてください</p>
      </div>

      <div class="field-group">
        <span class="field-label" id="labelName">氏名</span>
        <input type="text" class="field-input" id="loginName" placeholder="山田 太郎" autocomplete="name">
      </div>

      <div class="field-group">
        <span class="field-label" id="labelEmployeeId">社員番号</span>
        <input type="text" class="field-input" id="loginEmployeeId" placeholder="1234" inputmode="numeric" autocomplete="off">
      </div>

      <p class="login-error" id="loginError"></p>

      <button type="button" class="login-submit-btn" id="loginSubmitBtn" onclick="doLogin()">
        <span id="loginBtnText">ログイン</span>
      </button>
    </div>
  </div>

  <div class="app-container" id="appContainer">
    <header class="header">
      <div>
        <h1 id="appTitle">BizCard Scan</h1>
        <div class="user-chip">
          <span id="welcomeText">ようこそ、</span><span class="user-name" id="userNameDisplay"></span>
          <button type="button" class="logout-link" id="logoutBtn" onclick="doLogout()">ログアウト</button>
        </div>
      </div>
      <div class="lang-switcher">
        <button type="button" class="lang-btn active" id="btnJP" onclick="switchLang('JP')">🇯🇵 日本語</button>
        <button type="button" class="lang-btn" id="btnVN" onclick="switchLang('VN')">🇻🇳 Tiếng Việt</button>
      </div>
    </header>

    <!-- モード切り替えタブ -->
    <nav class="mode-tabs">
      <button type="button" class="mode-btn active" id="modeSingle" onclick="switchMode('single')">片面撮影</button>
      <button type="button" class="mode-btn" id="modeDouble" onclick="switchMode('double')">両面撮影</button>
      <button type="button" class="mode-btn" id="modeBatch" onclick="switchMode('batch')">連続撮影 (最大15枚)</button>
    </nav>

    <!-- 表面カード -->
    <div class="scan-card" id="cardFront">
      <div class="card-label">
        <span id="frontTitle">表面 (Front)</span>
        <span class="badge" id="frontBadge">必須</span>
      </div>
      <div class="dropzone" id="dzFront">
        <input type="file" id="fileFront" accept="image/*" capture="environment">
        <div class="dropzone-empty" id="emptyFront">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span id="tapFrontText">タップして撮影</span>
        </div>
        <img id="prevFront" class="dropzone-preview" alt="Front Preview">
        <div class="retake-overlay" id="retakeFront">再撮影</div>
      </div>
    </div>

    <!-- 裏面カード（両面モード） -->
    <div class="scan-card" id="cardBack" style="display: none;">
      <div class="card-label">
        <span id="backTitle">裏面 (Back)</span>
        <span class="badge" id="backBadge">必須</span>
      </div>
      <div class="dropzone" id="dzBack">
        <input type="file" id="fileBack" accept="image/*" capture="environment">
        <div class="dropzone-empty" id="emptyBack">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span id="tapBackText">タップして撮影</span>
        </div>
        <img id="prevBack" class="dropzone-preview" alt="Back Preview">
        <div class="retake-overlay" id="retakeBack">再撮影</div>
      </div>
    </div>

    <!-- 連続撮影カード（連続撮影モード） -->
    <div class="scan-card" id="cardBatch" style="display: none;">
      <div class="card-label">
        <span id="batchTitle">連続カメラ撮影</span>
        <span class="badge" id="batchBadge">0 / 15 枚</span>
      </div>

      <!-- ライブカメラ方式：起動ボタン -->
      <button type="button" class="start-camera-btn" id="startCameraBtn" onclick="startBatchCamera()">カメラを起動して連続撮影を開始</button>

      <!-- ライブカメラ方式：プレビュー＋シャッター（タップごとに即撮影・カメラは開いたまま） -->
      <div class="camera-wrap" id="cameraWrap">
        <video id="batchVideo" playsinline autoplay muted></video>
        <div class="camera-count-badge" id="cameraCountBadge">0 / 15</div>
        <button type="button" class="camera-finish-btn" id="cameraFinishBtn" onclick="finishBatchCamera()">この枚数で終了</button>
        <div class="camera-controls">
          <button type="button" class="shutter-btn" id="shutterBtn" onclick="captureBatchPhoto()" aria-label="撮影"></button>
        </div>
      </div>
      <canvas id="batchCanvas" style="display:none;"></canvas>

      <!-- フォールバック：カメラ起動不可の場合に従来のファイル入力方式を表示 -->
      <div class="dropzone" id="dzBatchFallback" style="display: none;">
        <input type="file" id="fileBatch" accept="image/*" capture="environment">
        <div class="dropzone-empty" id="emptyBatch">
          <svg viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
            <circle cx="12" cy="13" r="4"></circle>
          </svg>
          <span id="tapBatchText">タップして名刺を撮影（追加）</span>
        </div>
      </div>

      <!-- 撮影した名刺リスト -->
      <div class="batch-grid" id="batchGrid"></div>
    </div>
  </div>

  <!-- 下部固定送信ボタン -->
  <div class="sticky-footer" id="stickyFooter" style="display:none;">
    <div class="footer-inner">
      <button type="button" class="submit-btn" id="submitBtn" disabled onclick="handleUpload()">
        <span id="submitText">写真を撮影してください</span>
      </button>
    </div>
  </div>

  <!-- 処理中ローディングオーバーレイ -->
  <div class="loading-overlay" id="loadingOverlay">
    <div class="loading-box">
      <div class="spinner"></div>
      <p class="loading-text" id="loadingTitle">AI解析中...</p>
      <p class="loading-sub" id="loadingSubtitle">名刺データを読み取っています</p>
    </div>
  </div>

  <!-- トースト通知 -->
  <div class="toast-container">
    <div class="toast" id="toast"></div>
  </div>

  <script>
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwuw0JsXEABa1m6C7B1SGkNlHL5uhj9-YC0gLuSg4pW-QAa2o_YxUO8upmcnnivAXRr6g/exec";

    let currentLang = 'JP';
    let currentMode = 'single';
    let base64Front = null;
    let base64Back = null;
    let batchImages = []; // 連続撮影された画像の配列

    // ライブカメラ関連の状態
    let batchStream = null;
    let isCapturing = false;
    let autoUploadTriggered = false;

    // ==== 認証関連の状態 ====
    let authToken = localStorage.getItem('bizcard_token') || null;
    let authName = localStorage.getItem('bizcard_name') || null;

    const dict = {
      JP: {
        modeSingle: '片面撮影',
        modeDouble: '両面撮影',
        modeBatch: '連続撮影 (最大15枚)',
        frontTitle: '表面',
        backTitle: '裏面',
        batchTitle: '連続カメラ撮影',
        badgeRequired: '必須',
        tapToScan: 'タップして撮影',
        tapToBatch: 'タップして名刺を撮影（追加）',
        tapToBatchAdd: 'さらに撮影して追加する',
        retake: '再撮影',
        startCamera: 'カメラを起動して連続撮影を開始',
        finishCamera: 'この枚数で終了',
        btnNeedPhoto: '写真を撮影してください',
        btnNeedBackPhoto: '裏面を撮影してください',
        btnNeedBatchPhoto: '写真を撮影してください (0/15)',
        btnSubmit: '読み込んで登録する (JP)',
        btnSubmitBatch: (cnt) => `${cnt} 枚を一括登録する (JP)`,
        loadingTitle: 'AI解析中...',
        loadingSub: 'スプレッドシートへ登録しています',
        success: '登録が完了しました！',
        successBatch: (cnt) => `全 ${cnt} 枚の登録が完了しました！`,
        errorNet: '通信エラーが発生しました',
        errorLimit: '連続撮影は最大15枚までです',
        cameraError: 'カメラを起動できませんでした。従来の方法で撮影してください。',
        limitReachedAuto: '15枚に達しました。自動でアップロードします。',
        // ログイン画面
        loginTitle: 'BizCard Scan',
        loginSubtitle: '氏名と社員番号でログインしてください',
        labelName: '氏名',
        labelEmployeeId: '社員番号',
        namePlaceholder: '山田 太郎',
        loginBtn: 'ログイン',
        loginBtnLoading: '確認中...',
        loginNeedBoth: '氏名と社員番号を入力してください',
        welcomeText: 'ようこそ、',
        logout: 'ログアウト',
        sessionExpired: 'セッションが切れました。再度ログインしてください。'
      },
      VN: {
        modeSingle: 'Chụp 1 mặt',
        modeDouble: 'Chụp 2 mặt',
        modeBatch: 'Chụp liên tục (Tối đa 15)',
        frontTitle: 'Mặt trước',
        backTitle: 'Mặt sau',
        batchTitle: 'Chụp ảnh liên tục',
        badgeRequired: 'Bắt buộc',
        tapToScan: 'Chạm để chụp ảnh',
        tapToBatch: 'Chạm để chụp thêm danh thiếp',
        tapToBatchAdd: 'Chụp tiếp để thêm ảnh',
        retake: 'Chụp lại',
        startCamera: 'Khởi động camera để chụp liên tục',
        finishCamera: 'Hoàn tất số ảnh này',
        btnNeedPhoto: 'Vui lòng chụp ảnh danh thiếp',
        btnNeedBackPhoto: 'Vui lòng chụp thêm mặt sau',
        btnNeedBatchPhoto: 'Vui lòng chụp ít nhất 1 ảnh (0/15)',
        btnSubmit: 'Quét và Lưu vào VN',
        btnSubmitBatch: (cnt) => `Lưu ${cnt} danh thiếp vào VN`,
        loadingTitle: 'Đang phân tích...',
        loadingSub: 'Đang lưu dữ liệu vào Google Sheet',
        success: 'Đã lưu thành công!',
        successBatch: (cnt) => `Đã hoàn tất lưu ${cnt} danh thiếp!`,
        errorNet: 'Đã xảy ra lỗi kết nối',
        errorLimit: 'Tối đa có thể chụp liên tục 15 tấm ảnh',
        cameraError: 'Không thể khởi động camera. Vui lòng chụp theo cách thông thường.',
        limitReachedAuto: 'Đã đạt 15 ảnh. Đang tự động tải lên.',
        // ログイン画面
        loginTitle: 'BizCard Scan',
        loginSubtitle: 'Vui lòng đăng nhập bằng họ tên và mã nhân viên',
        labelName: 'Họ và tên',
        labelEmployeeId: 'Mã nhân viên',
        namePlaceholder: 'Nguyễn Văn A',
        loginBtn: 'Đăng nhập',
        loginBtnLoading: 'Đang kiểm tra...',
        loginNeedBoth: 'Vui lòng nhập họ tên và mã nhân viên',
        welcomeText: 'Xin chào, ',
        logout: 'Đăng xuất',
        sessionExpired: 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.'
      }
    };

    function switchLang(lang) {
      currentLang = lang;
      document.getElementById('btnJP').classList.toggle('active', lang === 'JP');
      document.getElementById('btnVN').classList.toggle('active', lang === 'VN');
      document.getElementById('loginBtnJP').classList.toggle('active', lang === 'JP');
      document.getElementById('loginBtnVN').classList.toggle('active', lang === 'VN');

      const d = dict[currentLang];
      document.getElementById('modeSingle').innerText = d.modeSingle;
      document.getElementById('modeDouble').innerText = d.modeDouble;
      document.getElementById('modeBatch').innerText = d.modeBatch;
      document.getElementById('frontTitle').innerText = d.frontTitle;
      document.getElementById('backTitle').innerText = d.backTitle;
      document.getElementById('batchTitle').innerText = d.batchTitle;
      document.getElementById('frontBadge').innerText = d.badgeRequired;
      document.getElementById('backBadge').innerText = d.badgeRequired;
      document.getElementById('tapFrontText').innerText = d.tapToScan;
      document.getElementById('tapBackText').innerText = d.tapToScan;
      document.getElementById('retakeFront').innerText = d.retake;
      document.getElementById('retakeBack').innerText = d.retake;
      document.getElementById('startCameraBtn').innerText = d.startCamera;
      document.getElementById('cameraFinishBtn').innerText = d.finishCamera;

      // ログイン画面のテキスト
      document.getElementById('loginTitle').innerText = d.loginTitle;
      document.getElementById('loginSubtitle').innerText = d.loginSubtitle;
      document.getElementById('labelName').innerText = d.labelName;
      document.getElementById('labelEmployeeId').innerText = d.labelEmployeeId;
      document.getElementById('loginName').placeholder = d.namePlaceholder;
      document.getElementById('loginBtnText').innerText = d.loginBtn;
      document.getElementById('welcomeText').innerText = d.welcomeText;
      document.getElementById('logoutBtn').innerText = d.logout;

      updateBatchStatusText();
      updateButtonState();
    }

    function switchMode(mode) {
      // 連続撮影モードから離れるときはカメラを止める
      if (currentMode === 'batch' && mode !== 'batch') {
        stopBatchCamera();
      }

      currentMode = mode;
      document.getElementById('modeSingle').classList.toggle('active', mode === 'single');
      document.getElementById('modeDouble').classList.toggle('active', mode === 'double');
      document.getElementById('modeBatch').classList.toggle('active', mode === 'batch');

      if (mode === 'single') {
        document.getElementById('cardFront').style.display = 'flex';
        document.getElementById('cardBack').style.display = 'none';
        document.getElementById('cardBatch').style.display = 'none';
      } else if (mode === 'double') {
        document.getElementById('cardFront').style.display = 'flex';
        document.getElementById('cardBack').style.display = 'flex';
        document.getElementById('cardBatch').style.display = 'none';
      } else if (mode === 'batch') {
        document.getElementById('cardFront').style.display = 'none';
        document.getElementById('cardBack').style.display = 'none';
        document.getElementById('cardBatch').style.display = 'flex';
      }

      updateButtonState();
    }

    function setupFileInput(inputId, emptyId, prevId, retakeId, onDone) {
      document.getElementById(inputId).addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(evt) {
          compressImage(evt.target.result, 900, 0.68, function(compressedBase64) {
            const preview = document.getElementById(prevId);
            preview.src = compressedBase64;
            preview.style.display = 'block';
            document.getElementById(emptyId).style.display = 'none';
            document.getElementById(retakeId).style.display = 'block';

            onDone(compressedBase64);
            updateButtonState();
          });
        };
        reader.readAsDataURL(file);
      });
    }

    setupFileInput('fileFront', 'emptyFront', 'prevFront', 'retakeFront', (b64) => { base64Front = b64; });
    setupFileInput('fileBack', 'emptyBack', 'prevBack', 'retakeBack', (b64) => { base64Back = b64; });

    // フォールバック：ファイル入力方式での連続撮影（カメラAPIが使えない場合のみ）
    document.getElementById('fileBatch').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      if (batchImages.length >= 15) {
        showToast(dict[currentLang].errorLimit, 'error');
        this.value = '';
        return;
      }

      const reader = new FileReader();
      reader.onload = function(evt) {
        compressImage(evt.target.result, 900, 0.68, function(compressedBase64) {
          addBatchImage(compressedBase64);
          document.getElementById('fileBatch').value = '';
        });
      };
      reader.readAsDataURL(file);
    });

    // ==== ライブカメラによる連続撮影 ====

    async function startBatchCamera() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showCameraFallback();
        return;
      }

      try {
        batchStream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 960 }
          },
          audio: false
        });

        const video = document.getElementById('batchVideo');
        video.srcObject = batchStream;
        await video.play();

        document.getElementById('startCameraBtn').style.display = 'none';
        document.getElementById('cameraWrap').style.display = 'block';
        document.getElementById('dzBatchFallback').style.display = 'none';
      } catch (err) {
        console.error(err);
        showCameraFallback();
        showToast(dict[currentLang].cameraError, 'error');
      }
    }

    function showCameraFallback() {
      document.getElementById('startCameraBtn').style.display = 'none';
      document.getElementById('cameraWrap').style.display = 'none';
      document.getElementById('dzBatchFallback').style.display = 'flex';
    }

    function stopBatchCamera() {
      if (batchStream) {
        batchStream.getTracks().forEach(t => t.stop());
        batchStream = null;
      }
      document.getElementById('cameraWrap').style.display = 'none';
      document.getElementById('startCameraBtn').style.display = 'block';
    }

    function finishBatchCamera() {
      stopBatchCamera();
    }

    function captureBatchPhoto() {
      if (isCapturing || batchImages.length >= 15) return;
      isCapturing = true;

      const video = document.getElementById('batchVideo');
      const canvas = document.getElementById('batchCanvas');
      canvas.width = video.videoWidth || 1280;
      canvas.height = video.videoHeight || 960;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const rawDataUrl = canvas.toDataURL('image/jpeg', 0.9);

      flashShutter();

      compressImage(rawDataUrl, 900, 0.68, function(compressedBase64) {
        addBatchImage(compressedBase64);
        isCapturing = false;

        if (batchImages.length >= 15) {
          stopBatchCamera();
          if (!autoUploadTriggered) {
            autoUploadTriggered = true;
            showToast(dict[currentLang].limitReachedAuto, 'success');
            handleUpload();
          }
        }
      });
    }

    function flashShutter() {
      const wrap = document.getElementById('cameraWrap');
      wrap.style.opacity = '0.35';
      setTimeout(() => { wrap.style.opacity = '1'; }, 90);
    }

    function addBatchImage(compressedBase64) {
      batchImages.push(compressedBase64);
      renderBatchGrid();
      updateBatchStatusText();
      updateButtonState();
    }

    function renderBatchGrid() {
      const grid = document.getElementById('batchGrid');
      grid.innerHTML = '';

      batchImages.forEach((imgSrc, idx) => {
        const item = document.createElement('div');
        item.className = 'batch-thumb-item';

        const img = document.createElement('img');
        img.src = imgSrc;

        const countBadge = document.createElement('div');
        countBadge.className = 'batch-thumb-count';
        countBadge.innerText = `#${idx + 1}`;

        const delBtn = document.createElement('div');
        delBtn.className = 'batch-thumb-del';
        delBtn.innerText = '✕';
        delBtn.onclick = (e) => {
          e.stopPropagation();
          batchImages.splice(idx, 1);
          renderBatchGrid();
          updateBatchStatusText();
          updateButtonState();
        };

        item.appendChild(img);
        item.appendChild(countBadge);
        item.appendChild(delBtn);
        grid.appendChild(item);
      });
    }

    function updateBatchStatusText() {
      const count = batchImages.length;
      document.getElementById('batchBadge').innerText = `${count} / 15 枚`;

      const cameraBadge = document.getElementById('cameraCountBadge');
      if (cameraBadge) cameraBadge.innerText = `${count} / 15`;

      const shutterBtn = document.getElementById('shutterBtn');
      if (shutterBtn) shutterBtn.disabled = count >= 15;

      const tapBatchText = document.getElementById('tapBatchText');
      if (tapBatchText) {
        tapBatchText.innerText = count > 0
          ? dict[currentLang].tapToBatchAdd
          : dict[currentLang].tapToBatch;
      }
    }

    function compressImage(src, maxWidth, quality, cb) {
      const img = new Image();
      img.src = src;
      img.onload = function() {
        let w = img.width;
        let h = img.height;
        if (w > maxWidth) {
          h = Math.round((h * maxWidth) / w);
          w = maxWidth;
        }
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, w, h);

        let result = canvas.toDataURL('image/jpeg', quality);
        if (result.length > 137000) {
          result = canvas.toDataURL('image/jpeg', 0.5);
        }
        cb(result);
      };
    }

    function updateButtonState() {
      const btn = document.getElementById('submitBtn');
      const text = document.getElementById('submitText');
      const d = dict[currentLang];

      if (currentMode === 'single') {
        if (!base64Front) {
          btn.disabled = true;
          text.innerText = d.btnNeedPhoto;
        } else {
          btn.disabled = false;
          text.innerText = d.btnSubmit;
        }
      } else if (currentMode === 'double') {
        if (!base64Front) {
          btn.disabled = true;
          text.innerText = d.btnNeedPhoto;
        } else if (!base64Back) {
          btn.disabled = true;
          text.innerText = d.btnNeedBackPhoto;
        } else {
          btn.disabled = false;
          text.innerText = d.btnSubmit;
        }
      } else if (currentMode === 'batch') {
        if (batchImages.length === 0) {
          btn.disabled = true;
          text.innerText = d.btnNeedBatchPhoto;
        } else {
          btn.disabled = false;
          text.innerText = d.btnSubmitBatch(batchImages.length);
        }
      }
    }

    function showToast(msg, type = 'success') {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.className = `toast show ${type}`;
      setTimeout(() => { toast.className = 'toast'; }, 4000);
    }

    // ==== ログイン処理 ====

    function showLoginScreen() {
      document.getElementById('loginOverlay').style.display = 'flex';
      document.getElementById('appContainer').style.display = 'none';
      document.getElementById('stickyFooter').style.display = 'none';
    }

    function showAppScreen() {
      document.getElementById('loginOverlay').style.display = 'none';
      document.getElementById('appContainer').style.display = 'flex';
      document.getElementById('stickyFooter').style.display = 'flex';
      document.getElementById('userNameDisplay').innerText = authName || '';
    }

    async function doLogin() {
      const d = dict[currentLang];
      const nameInput = document.getElementById('loginName');
      const idInput = document.getElementById('loginEmployeeId');
      const errorEl = document.getElementById('loginError');
      const btn = document.getElementById('loginSubmitBtn');
      const btnText = document.getElementById('loginBtnText');

      const name = nameInput.value.trim();
      const employeeId = idInput.value.trim();

      errorEl.innerText = '';

      if (!name || !employeeId) {
        errorEl.innerText = d.loginNeedBoth;
        return;
      }

      btn.disabled = true;
      btnText.innerText = d.loginBtnLoading;

      try {
        const res = await fetch(GAS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ action: 'login', name: name, employeeId: employeeId })
        }).then(r => r.json());

        if (res.success) {
          authToken = res.token;
          authName = res.name;
          localStorage.setItem('bizcard_token', authToken);
          localStorage.setItem('bizcard_name', authName);
          showAppScreen();
        } else {
          errorEl.innerText = res.error || d.loginNeedBoth;
        }
      } catch (err) {
        errorEl.innerText = d.errorNet;
      } finally {
        btn.disabled = false;
        btnText.innerText = d.loginBtn;
      }
    }

    function doLogout() {
      authToken = null;
      authName = null;
      localStorage.removeItem('bizcard_token');
      localStorage.removeItem('bizcard_name');
      document.getElementById('loginName').value = '';
      document.getElementById('loginEmployeeId').value = '';
      showLoginScreen();
    }

    // セッション切れらしきエラーかどうかを緩く判定
    function looksLikeSessionExpired(errMsg) {
      if (!errMsg) return false;
      return errMsg.indexOf('セッション') !== -1 || errMsg.indexOf('phiên') !== -1 || errMsg.toLowerCase().indexOf('session') !== -1;
    }

    function sendToGas(images) {
      return fetch(GAS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ images: images, lang: currentLang, token: authToken })
      }).then(res => res.json());
    }

    async function handleUpload() {
      const d = dict[currentLang];
      document.getElementById('loadingOverlay').style.display = 'flex';
      document.getElementById('loadingTitle').innerText = d.loadingTitle;

      if (currentMode === 'single' || currentMode === 'double') {
        const images = (currentMode === 'single') ? [base64Front] : [base64Front, base64Back];
        document.getElementById('loadingSubtitle').innerText = d.loadingSub;

        try {
          const res = await sendToGas(images);
          document.getElementById('loadingOverlay').style.display = 'none';
          if (res.success) {
            showToast(`✅ ${d.success}\n${res.company || ''} ${res.name || ''}`.trim(), 'success');
            resetForm();
          } else if (looksLikeSessionExpired(res.error)) {
            doLogout();
            showToast(`⚠️ ${d.sessionExpired}`, 'error');
          } else {
            showToast(`❌ ${res.error}`, 'error');
          }
        } catch (err) {
          document.getElementById('loadingOverlay').style.display = 'none';
          showToast(`❌ ${d.errorNet}`, 'error');
        }

      } else if (currentMode === 'batch') {
        // 連続撮影した画像を1枚ずつGASへ送信（キュー処理）
        const total = batchImages.length;
        let successCount = 0;
        let sessionLost = false;

        for (let i = 0; i < total; i++) {
          document.getElementById('loadingSubtitle').innerText = `${i + 1} / ${total} 枚目を処理中...`;

          try {
            const res = await sendToGas([batchImages[i]]);
            if (res.success) {
              successCount++;
            } else if (looksLikeSessionExpired(res.error)) {
              sessionLost = true;
              break;
            }
          } catch (e) {
            console.error(e);
          }
        }

        document.getElementById('loadingOverlay').style.display = 'none';

        if (sessionLost) {
          doLogout();
          showToast(`⚠️ ${d.sessionExpired}`, 'error');
        } else {
          showToast(`✅ ${d.successBatch(successCount)}`, 'success');
        }
        resetForm();
      }
    }

    function resetForm() {
      base64Front = null;
      base64Back = null;
      batchImages = [];
      autoUploadTriggered = false;

      document.getElementById('fileFront').value = '';
      document.getElementById('fileBack').value = '';
      document.getElementById('fileBatch').value = '';
      document.getElementById('prevFront').style.display = 'none';
      document.getElementById('prevBack').style.display = 'none';
      document.getElementById('emptyFront').style.display = 'flex';
      document.getElementById('emptyBack').style.display = 'flex';
      document.getElementById('retakeFront').style.display = 'none';
      document.getElementById('retakeBack').style.display = 'none';
      document.getElementById('batchGrid').innerHTML = '';

      stopBatchCamera();
      document.getElementById('dzBatchFallback').style.display = 'none';

      updateBatchStatusText();
      updateButtonState();
    }

    // 初期化
    switchLang('JP');

    if (authToken && authName) {
      showAppScreen();
    } else {
      showLoginScreen();
    }

    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('sw.js'); }
  </script>
</body>
</html>
